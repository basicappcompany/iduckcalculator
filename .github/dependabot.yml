# Keeps dependencies and the GitHub Actions the CI uses up to date. Each pull request costs a full CI run, so updates come once a month,
# the minor and patch updates of each ecosystem share one pull request, and at most two are open at a time (CI must pass before merging).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # astro check does not support TypeScript 7 yet (it stops with an error). Remove this when it does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
