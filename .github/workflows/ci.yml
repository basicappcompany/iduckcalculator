name: CI

# Actions minutes are limited, so this workflow spends as few as it can:
# - a change that only touches documents does not start it (the docs are checked by `docs-sync`);
# - a newer push to the same branch cancels the run still going for the older one;
# - the browser tests (about 70% of a run) run on pull requests only: the merge into main is the same code, so main gets the quick checks.
on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on a known high or critical vulnerability in anything that ships to visitors. Dev-only tooling is reported but not blocked.
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      # I18N_LOG makes the build record any English text a translated page shows, and i18n:audit fails if there is any.
      - run: pnpm build
        env:
          I18N_LOG: '1'
      - run: pnpm seo:check
      - run: pnpm i18n:audit
      # The site was built above (with I18N_LOG, which only records text): serve that build instead of building a second time.
      - run: pnpm test:e2e
        if: github.event_name == 'pull_request'
        env:
          E2E_NO_BUILD: '1'
